<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDV321 Advanced JavaScript</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color:burlywood;
        }
        #container {
            width:70%;
            margin-left:auto;
            margin-right:auto;
            padding-left:15px;
            padding-right:15px;
            background-color: chocolate;
        }

        header {
            text-align: center;
        }

        nav {
            display:flex;
            justify-content: space-between;
            margin-bottom:15px;
        }

        main {
            display:flex;
        }

        main section {
            width:50%;
            border:thin solid black;

        }

        section h2, section h3 {
            text-align: center;
        }

        form {
            width: 70%;
            margin-left:auto;
            margin-right:auto;
        }

        footer p {
            text-align: center;
        }

        .pageHeader {
            color:blue;
        }
    </style>
    <script>
        //Instructions:
        //1. This page will check for an authorized user cookie.  If there isn't one return the user to the home/index page.
        //      If it is an authorized user then display the page and contents.
        //
        //2. Each time an authorized user comes to this page display the current value of the hit counter next to "Current Activity:"
        //
        //3. Access the eventRegistration object from local storage.
        //      Display the guest information as formatted content under "Current Registrations" in the right column
        //      Number the guests
        //
        //4. Display Cookie button should show the current cookies in the console
        //5. Delete Cookie button should delete the authorization

        // This function is a utility to get a cookie value by name
        // example: decodeURIComponent("city%3DDes%20Moines%26state%3DIA") → "city=Des Moines&state=IA"
        // note: this function assumes cookies are in the format "name=value; name2=value2; ..."
        function getCookie(cookieName) {
            const cookies = document.cookie ? document.cookie.split(";") : [];
            for (const cookie of cookies) {
                const [name, ...rest] = cookie.trim().split("=");
                if (name === cookieName) {
                    return decodeURIComponent(rest.join("="));
                }
            }
            return "";
        }

        function deleteCookie(cookieName) {
            document.cookie = `${cookieName}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/`;
        }

        function updateCurrentActivityDisplay(value) {
            const el = document.getElementById("currentActivityValue");
            if (el) el.textContent = String(value);
        }

        function renderRegistrations() {
            const host = document.getElementById("registrationsHost");
            if (!host) return;

            host.innerHTML = "";
            const stored = localStorage.getItem("eventRegistration");
            if (!stored) {
                host.textContent = "No registrations yet.";
                return;
            }

            let registrations = [];
            try {
                const parsed = JSON.parse(stored);
                if (parsed && Array.isArray(parsed.registrations)) {
                    registrations = parsed.registrations;
                }
            } catch {
                registrations = [];
            }

            if (registrations.length === 0) {
                host.textContent = "No registrations yet.";
                return;
            }

            const list = document.createElement("ol");
            for (const reg of registrations) {
                const item = document.createElement("li");
                item.innerHTML = `<strong>${reg.name}</strong><br>Email: ${reg.email}<br>Phone: ${reg.phone}<br>Registered: ${reg.registrationDate}`;
                list.appendChild(item);
            }
            host.appendChild(list);
        }

        // Main logic to run when the page loads. Checks for authorization, updates activity display, renders registrations, and sets up button event listeners.
        // Registers a DOMContentLoaded event handler so the logic runs only after the browser has finished 
        // parsing the HTML into the DOM. That timing matters because the code immediately looks up elements like displayCookieButton and deleteAuthCookieButton; waiting for DOMContentLoaded ensures those elements exist before calling document.getElementById(...).
        window.addEventListener("DOMContentLoaded", () => {
            const authorizedUser = getCookie("authorizedUser");
            if (!authorizedUser) {
                window.location.replace("index.html");
                return;
            }

            const hitCounterValue = getCookie("hitCounter");
            updateCurrentActivityDisplay(hitCounterValue || 0);

            renderRegistrations();

            const displayCookieButton = document.getElementById("displayCookieButton");
            if (displayCookieButton) {
                displayCookieButton.addEventListener("click", () => {
                    console.log("Current cookies:", document.cookie);
                });
            }

            const deleteAuthButton = document.getElementById("deleteAuthCookieButton");
            if (deleteAuthButton) {
                deleteAuthButton.addEventListener("click", () => {
                    deleteCookie("authorizedUser");
                    window.location.replace("index.html");
                });
            }
        });

    </script>
</head>
<body>
    <div id="container">

        <header>
            <h1>Science Fiction Book Club</h1>
            <h2>"Predicting the future using or describing the future?"</h2>
            <h2 class="pageHeader">Welcome Federation Members!</h2>
        </header>

        <nav>
            <div>
                <a href="index.html"><button>Home Page</button></a>
                <a href="members.html"><button>Members Page</button></a>
            </div>
        </nav>

        <main>
            <section class="leftColumn">
                <h3>Member Information</h3>
                <p>
                    <button id="displayCookieButton" type="button">Display Cookie</button>
                    <button id="deleteAuthCookieButton" type="button">Delete Authorization Cookie</button>
                </p>
            </section>
            <section class="rightColumn">
                <h3>Upcoming Events</h3>
                <div>
                    <h3>"Did Star Trek predict AI?"</h3>
                </div>
                <div>
                    <h3>Current Registrations</h3>
                    <div id="registrationsHost"></div>
                </div>
            </section>
        </main>

        <footer>
            <p>Copyright &copy;YYYY All rights reserved.</p>
            <p>Current Activity: <span id="currentActivityValue">0</span></p>
        </footer>

    </div>
</body>
</html>
