<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Rating</title>
    <style>
      :root {
        --bg: #1d1f24;
        --panel: #252830;
        --text: #e7e9ee;
        --muted: #a9afbc;
        --line: #3b3f4a;
        --btn: #313542;
        --btn-hover: #3a3f4d;
        --danger: #ff5f5f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #2a2d37 0%, var(--bg) 45%, #191b20 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      main {
        width: min(92vw, 420px);
        background: linear-gradient(180deg, #2a2d35 0%, var(--panel) 100%);
        border: 1px solid #2f3340;
        border-radius: 8px;
        padding: 18px 16px;
      }

      h1 {
        margin: 0 0 12px;
        text-align: center;
        font-size: 1.9rem;
        font-weight: 700;
      }

      #movie-form {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 14px;
        font-size: 0.7rem;
      }

      #movie-name {
        flex: 1;
        min-width: 0;
      }

      input[type="text"] {
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 2px 6px;
        background: #181a20;
        color: var(--text);
      }

      button {
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 2px 7px;
        background: var(--btn);
        color: var(--text);
        font-size: 0.62rem;
        cursor: pointer;
      }

      button:hover {
        background: var(--btn-hover);
      }

      #movie-list {
        display: grid;
        gap: 10px;
      }

      .movie-card {
        border-top: 1px solid #343846;
        padding-top: 8px;
      }

      .movie-card h2 {
        margin: 0;
        text-align: center;
        font-size: 0.95rem;
      }

      .movie-card p {
        margin: 4px 0 7px;
        text-align: center;
        color: var(--muted);
        font-size: 0.63rem;
      }

      .rating-star {
        color: #f4d44e;
      }

      .movie-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .movie-actions label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
        font-size: 0.65rem;
      }

      .movie-actions input[type="checkbox"] {
        width: 11px;
        height: 11px;
        margin: 0;
      }

      .x-icon {
        color: var(--danger);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Movie Rating</h1>

      <form id="movie-form">
        <label for="movie-name">Name:</label>
        <input id="movie-name" name="movie-name" type="text" />
        <button id="add-movie" type="button">Add</button>
      </form>

      <section id="movie-list" aria-label="Movie list">
        <article class="movie-card">
          <h2>Inception</h2>
          <p>
            Rating: <span class="rating-value">0</span>
            <span class="rating-star" aria-hidden="true">*</span>
          </p>

          <div class="movie-actions">
            <button type="button">Add Star</button>
            <button type="button">Remove Star</button>
            <button type="button">Reset Ratings</button>
            <label>
              <input type="checkbox" />
              <span class="x-icon" aria-hidden="true">X</span> Unwatched
            </label>
          </div>
        </article>

        <article class="movie-card">
          <h2>The Matrix</h2>
          <p>
            Rating: <span class="rating-value">0</span>
            <span class="rating-star" aria-hidden="true">*</span>
          </p>

          <div class="movie-actions">
            <button type="button">Add Star</button>
            <button type="button">Remove Star</button>
            <button type="button">Reset Ratings</button>
            <label>
              <input type="checkbox" />
              <span class="x-icon" aria-hidden="true">X</span> Unwatched
            </label>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
